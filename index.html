<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatScrub - WhatsApp Text Formatter</title>
    
    <!-- SEO and Social Sharing Tags -->
    <meta name="description" content="A private, browser-based tool to format and anonymize WhatsApp chat exports.">
    <meta property="og:title" content="ChatScrub - Format WhatsApp Chats">
    <meta property="og:description" content="Clean up transcripts and protect privacy instantly. No data ever leaves your device.">
    <meta property="og:type" content="website">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap');
        
        body {
            background-color: #f8fafc;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            // Load initial state from localStorage or defaults
            const [inputText, setInputText] = useState("");
            const [formattedText, setFormattedText] = useState("");
            const [timeOption, setTimeOption] = useState(() => localStorage.getItem('scrub_time_opt') || "remove");
            const [nameOption, setNameOption] = useState(() => localStorage.getItem('scrub_name_opt') || "keep");
            const [showCopyFeedback, setShowCopyFeedback] = useState(false);

            // Persist preferences
            useEffect(() => {
                localStorage.setItem('scrub_time_opt', timeOption);
                localStorage.setItem('scrub_name_opt', nameOption);
            }, [timeOption, nameOption]);

            const exampleText = `[7/26/2025, 11:19 AM] Octavius Tech: I will ask my boss n let you know[7/26/2025, 11:20 AM] +86 198 0431 5205: Thank you. Could you let me know asap? Because we only have one 20W laser head in stock[7/26/2025, 11:20 AM] Octavius Tech: Ok`;

            const parseMessages = (text) => {
                if (!text) return [];
                const splitRegex = /(?=\[\d{1,2}\/\d{1,2}\/\d{2,4},\s+\d{1,2}:\d{2}[\s\u202F]?[APap][Mm]\])/;
                const chunks = text.split(splitRegex);
                
                return chunks.map(chunk => {
                    const cleanChunk = chunk.trim();
                    if (!cleanChunk) return null;
                    const match = cleanChunk.match(/^\[(.*?)\] (.*?): (.*)$/s);
                    if (match) {
                        const fullTimestamp = match[1];
                        const name = match[2];
                        const message = match[3];
                        const tsParts = fullTimestamp.split(',').map(s => s.trim());
                        return {
                            originalTimestamp: fullTimestamp,
                            date: tsParts[0] || fullTimestamp,
                            time: tsParts.length > 1 ? tsParts.slice(1).join(' ') : "",
                            originalName: name,
                            message: message
                        };
                    }
                    return { isSystem: true, text: cleanChunk };
                }).filter(Boolean);
            };

            const processedMessages = useMemo(() => {
                const messages = parseMessages(inputText);
                const uniqueNames = [...new Set(messages.filter(m => !m.isSystem).map(m => m.originalName))];
                const substitutionMap = {};
                uniqueNames.forEach((name, index) => {
                    substitutionMap[name] = `User ${index + 1}`;
                });

                return messages.map(msg => {
                    if (msg.isSystem) return msg.text;
                    let ts = "";
                    if (timeOption === 'original') ts = `[${msg.originalTimestamp}] `;
                    else if (timeOption === 'date') ts = `[${msg.date}] `;
                    else if (timeOption === 'time') ts = `[${msg.time}] `;

                    let name = "";
                    if (nameOption === 'keep') name = `${msg.originalName}: `;
                    else if (nameOption === 'mask') {
                        const n = msg.originalName;
                        name = n.length <= 2 ? `${n}: ` : `${n[0]}...${n[n.length-1]}: `;
                    } else if (nameOption === 'substitute') name = `${substitutionMap[msg.originalName]}: `;

                    return `${ts}${name}${msg.message}`;
                });
            }, [inputText, timeOption, nameOption]);

            useEffect(() => {
                setFormattedText(processedMessages.join('\n'));
            }, [processedMessages]);

            const copyToClipboard = () => {
                const el = document.createElement('textarea');
                el.value = formattedText;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setShowCopyFeedback(true);
                setTimeout(() => setShowCopyFeedback(false), 2000);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-white border-b border-gray-200 py-4 px-6 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto flex flex-row justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-green-600 p-1.5 md:p-2 rounded-xl">
                                    <i data-lucide="shield-check" className="text-white w-5 h-5 md:w-6 md:h-6"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg md:text-xl font-bold text-gray-900 leading-none">ChatScrub</h1>
                                    <span className="text-[10px] md:text-xs font-bold text-green-600 uppercase tracking-tighter">Client-Side Only</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-3">
                                <button 
                                    onClick={() => setInputText(exampleText)}
                                    className="hidden sm:block text-sm font-medium text-gray-400 hover:text-gray-800 transition-colors"
                                >
                                    Try Example
                                </button>
                                <button 
                                    onClick={() => setInputText("")}
                                    className="px-3 py-2 text-xs md:text-sm font-semibold text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-all"
                                >
                                    Clear
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-8 space-y-6 md:space-y-8">
                        
                        <section className="grid md:grid-cols-2 gap-6 md:gap-8 items-center bg-green-600 rounded-2xl md:rounded-3xl p-6 md:p-8 text-white shadow-xl">
                            <div>
                                <h2 className="text-2xl md:text-3xl font-bold mb-3">Professional Chat Formatting</h2>
                                <p className="text-green-50 text-sm md:text-base opacity-90 mb-6 leading-relaxed">
                                    Securely clean and anonymize WhatsApp logs. Perfect for sharing conversation snippets in documents or public forums without the clutter.
                                </p>
                                <div className="hidden sm:flex flex-wrap gap-3">
                                    <div className="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full text-xs">
                                        <i data-lucide="lock" className="w-3 h-3 text-green-300"></i> Browser Processed
                                    </div>
                                    <div className="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full text-xs">
                                        <i data-lucide="zap" className="w-3 h-3 text-green-300"></i> Instant Preview
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white/10 rounded-xl p-5 backdrop-blur-sm border border-white/20">
                                <h3 className="text-sm font-bold mb-3 flex items-center gap-2">
                                    <i data-lucide="info" className="w-4 h-4"></i> Quick Instructions:
                                </h3>
                                <ol className="space-y-2 text-xs md:text-sm list-decimal list-inside opacity-90">
                                    <li>Copy your chat text from WhatsApp.</li>
                                    <li>Paste it into the <b>Input</b> area below.</li>
                                    <li>Use the <b>Options</b> to strip dates or hide names.</li>
                                    <li>Click <b>Copy Result</b> to save your clean text.</li>
                                </ol>
                            </div>
                        </section>

                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 md:p-6 flex flex-col lg:flex-row gap-6 md:gap-8">
                            <div className="flex-1">
                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">Time Settings</label>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    {[
                                        { id: 'remove', label: 'No Time' },
                                        { id: 'time', label: 'Time Only' },
                                        { id: 'date', label: 'Date Only' },
                                        { id: 'original', label: 'Original' },
                                    ].map(opt => (
                                        <button 
                                            key={opt.id}
                                            onClick={() => setTimeOption(opt.id)}
                                            className={`px-3 py-2 text-xs md:text-sm font-semibold rounded-lg border transition-all ${timeOption === opt.id ? 'bg-green-600 text-white border-green-600 shadow-md shadow-green-100' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-300'}`}
                                        >
                                            {opt.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="flex-1">
                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">Name Masking</label>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    {[
                                        { id: 'keep', label: 'Show All' },
                                        { id: 'remove', label: 'Remove' },
                                        { id: 'mask', label: 'Mask Initials' },
                                        { id: 'substitute', label: 'Alias' },
                                    ].map(opt => (
                                        <button 
                                            key={opt.id}
                                            onClick={() => setNameOption(opt.id)}
                                            className={`px-3 py-2 text-xs md:text-sm font-semibold rounded-lg border transition-all ${nameOption === opt.id ? 'bg-green-600 text-white border-green-600 shadow-md shadow-green-100' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-300'}`}
                                        >
                                            {opt.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="grid lg:grid-cols-2 gap-6 pb-20">
                            <div className="flex flex-col gap-2 md:gap-3">
                                <h3 className="px-1 text-[10px] font-bold text-gray-400 uppercase flex items-center gap-2">
                                    <i data-lucide="arrow-right-to-line" className="w-3 h-3"></i> Raw Input
                                </h3>
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-2 h-[400px] md:h-[500px] flex flex-col group transition-all focus-within:ring-2 focus-within:ring-green-500/20">
                                    <textarea 
                                        className="w-full h-full p-4 md:p-6 resize-none outline-none text-sm md:text-[15px] leading-relaxed text-gray-700 bg-transparent font-mono"
                                        placeholder="Paste WhatsApp text here..."
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                    ></textarea>
                                </div>
                            </div>

                            <div className="flex flex-col gap-2 md:gap-3">
                                <div className="flex justify-between items-center px-1">
                                    <h3 className="text-[10px] font-bold text-gray-400 uppercase flex items-center gap-2">
                                        <i data-lucide="check-circle" className="w-3 h-3"></i> Formatted Output
                                    </h3>
                                    <button 
                                        onClick={copyToClipboard}
                                        disabled={!formattedText}
                                        className={`flex items-center gap-2 px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-xs md:text-sm font-bold transition-all ${
                                            showCopyFeedback 
                                            ? 'bg-green-600 text-white scale-105 shadow-lg shadow-green-200' 
                                            : 'bg-gray-900 text-white hover:bg-black disabled:opacity-20'
                                        }`}
                                    >
                                        <i data-lucide={showCopyFeedback ? "check" : "copy"} className="w-3 h-3 md:w-4 md:h-4"></i>
                                        {showCopyFeedback ? 'Copied!' : 'Copy'}
                                    </button>
                                </div>
                                <div className="bg-gray-900 rounded-2xl shadow-xl p-2 h-[400px] md:h-[500px] flex flex-col relative">
                                    <textarea 
                                        readOnly
                                        className="w-full h-full p-4 md:p-6 resize-none outline-none text-sm md:text-[15px] leading-relaxed text-gray-300 font-mono bg-transparent"
                                        placeholder="Formatted output appears here..."
                                        value={formattedText}
                                    ></textarea>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="bg-white border-t border-gray-100 py-8 px-6 mt-auto">
                        <div className="max-w-7xl mx-auto flex flex-col items-center gap-2 text-gray-400 text-xs text-center">
                            <p className="font-medium text-gray-500">Security Note: No data is sent to any server.</p>
                            <p>© 2026 ChatScrub • Thilina C </p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        setTimeout(() => {
            lucide.createIcons();
        }, 150);
    </script>
</body>
</html>
